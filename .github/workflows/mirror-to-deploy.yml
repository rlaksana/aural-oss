name: Mirror main to deploy

# Keeps rlaksana/aural-deploy in lockstep with rlaksana/aural-oss on main.
# Requires the DEPLOY_TOKEN secret (a PAT with push access to aural-deploy)
# to be configured on this repository.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "::error::DEPLOY_TOKEN secret is not set — add a PAT with push access to rlaksana/aural-deploy as a repository secret."
            exit 1
          fi
          git push "https://x-access-token:${DEPLOY_TOKEN}@github.com/rlaksana/aural-deploy.git" main:main
